<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clip Review Builder | Explorer Music Video Lab</title>
    <meta name="description" content="Create a Markdown review note for generated or filmed music-video clips.">
    <meta name="theme-color" content="#0f6f73">
    <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../assets/css/styles.css">
  </head>
  <body data-page="builder-clip-review" data-builder="clip-review">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header" data-site-header></header>
    <main id="main" class="page-shell">
      <section class="page-hero small-hero">
        <h1>Clip Review Builder</h1>
        <p>Approve, revise, replace or export clips with a clear human review trail.</p>
      </section>
      <section class="section builder-layout" id="builder">
        <div class="form-card"><form class="builder-form" data-builder-form></form></div>
        <aside class="preview-card" aria-label="Markdown preview">
          <h2>Markdown preview</h2>
          <pre class="markdown-preview" data-markdown-preview></pre>
          <div class="builder-actions">
            <button class="button primary" type="button" data-copy-markdown>Copy Markdown</button>
            <button class="button secondary" type="button" data-download-markdown>Download .md</button>
            <button class="button" type="button" data-reset-builder>Clear</button>
          </div>
          <p class="copy-status" data-copy-status></p>
        </aside>
      </section>
    </main>
    <footer class="site-footer" data-site-footer></footer>
    <button class="to-top" type="button" data-to-top aria-label="Back to top">Top</button>
    <script src="../assets/js/site.js"></script>
    <script src="../assets/js/builder-data.js"></script>
    <script src="../assets/js/builder-page.js"></script>
  </body>
</html>
